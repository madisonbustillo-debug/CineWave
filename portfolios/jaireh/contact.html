<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
<div class="site-wrapper">
  <header class="main-header">
    <div class="container nav-flex">
      <div class="logo"><a href="../../about-contact.html">Portfolio</a></div>
      <nav class="navbar">
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="skills.html">Skills</a></li>
          <li><a href="interests.html">Interests</a></li>
          <li><a href="projects.html">Projects</a></li>
          <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
      </nav>
      <div class="mobile-toggle" id="mobileToggle"><i class="fas fa-bars"></i></div>
    </div>
  </header>
  <main class="main-content">
    <div class="container">
      <h1 class="page-heading">Let's connect</h1>
      <div class="contact-form">
        <form action="https://formsubmit.co" method="POST">
          <div class="form-group">
            <input type="text" placeholder="Your name" required>
          </div>
          <div class="form-group">
            <input type="email" placeholder="Email address" required>
          </div>
          <div class="form-group">
            <textarea placeholder="Your message..."></textarea>
          </div>
          <button type="submit" class="btn btn-primary">
            <i class="fas fa-paper-plane"></i> Send message
          </button>
        </form>
        <div class="contact-info-row">
          <abbr title="jairehvelasco8@gmail.com"><i class="fas fa-envelope"></i></abbr>
          <span class="placeholder-text">jairehvelasco8@gmail.com</span>
          <i class="fas fa-phone-alt" style="margin-left: 1rem"></i>
          <span class="placeholder-text">+63 09126925379</span>
        </div>
        <p class="placeholder-text" style="margin-top: 1.2rem">Keep Grinding</p>
      </div>
    </div>
  </main>
  <footer class="main-footer">
    <div class="container footer-inner">
      <div class="footer-copy">
        <p>© 2026</p>
      </div>
      <div class="footer-links">
        <a href="https://github.com/Jireh-dot"><i class="fab fa-github"></i></a>
        <a href="https://www.instagram.com/jehovah.ji?igsh=ZHJwOGE2Yje0cm5k"><i class="fa-brands fa-instagram"></i></a>
        <a href="https://facebook.com/jaireh.jimenez?mibextid=JRoKGi"><i class="fa-brands fa-facebook"></i></a>
      </div>
    </div>
  </footer>
</div>
<script>
  const toggleBtn = document.getElementById('mobileToggle');
  const navLinks = document.querySelector('.nav-links');
  if (toggleBtn) {
    toggleBtn.addEventListener('click', () => {
      navLinks.classList.toggle('show');
    });
  }
</script>
</body>
</html>
